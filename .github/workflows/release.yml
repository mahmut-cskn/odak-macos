name: macOS universal release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests/backup -v
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for odak_dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            odak_checksum="${odak_dmg%.dmg}_SHA256.txt"
            (cd "$(dirname "$odak_dmg")" && shasum -a 256 "$(basename "$odak_dmg")") > "$odak_checksum"
            gh release upload "$GITHUB_REF_NAME" "$odak_checksum" --clobber
          done
